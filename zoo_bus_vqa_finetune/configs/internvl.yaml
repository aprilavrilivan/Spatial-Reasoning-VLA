model_name: OpenGVLab/InternVL3_5-4B-HF
dataset_name: aprilavrilivan/zoo-bus-vqa
method: bf16 LoRA-SFT

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

lr: 1e-4
epochs: 3

per_device_train_batch_size: 8
per_device_eval_batch_size: 64
gradient_accumulation_steps: 8

max_seq_length: 4096
max_new_tokens_eval: 16

eval_steps: 300
save_steps: 300
logging_steps: 10

selection_metric: seen-type eval accuracy
report_to: wandb
wandb_project: zoo-bus-vqa-internvl-finetune
