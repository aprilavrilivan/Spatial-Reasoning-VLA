model_name: Qwen/Qwen3-VL-4B-Instruct
dataset_name: remyxai/OpenSpaces
method: OpenSpaces bf16 LoRA-SFT

train_split: train
test_split: test
eval_fraction: 0.1
max_eval_examples: 1024
max_test_examples: 1024

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

lr: 5e-6
max_grad_norm: 0.3
warmup_steps: 300
epochs: 3
max_steps: 2949

per_device_train_batch_size: 16
per_device_eval_batch_size: 64
gradient_accumulation_steps: 4

max_seq_length: 2048
max_new_tokens_eval: 64
image_min_pixels: 200704
image_max_pixels: 602112

eval_steps: 300
save_steps: 300
logging_steps: 10

selection_metric: OpenSpaces eval overall accuracy
report_to: wandb
wandb_project: openspaces-qwen-finetune
skip_pre_finetune_baseline: true
